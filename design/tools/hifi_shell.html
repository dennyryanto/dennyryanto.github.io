<style>
/* Layout: the live site's 1216px column and dark palette. New pieces: case index, case hero, toggle, drawer. */
:root {
  --bg: #161511;
  --card: rgb(16, 15, 9);
  --fg: #f2efe8;
  --fg-2: rgba(242, 239, 232, .72);
  --fg-3: rgba(242, 239, 232, .55);
  --rule: rgba(242, 239, 232, .14);
  --lime: oklch(0.9 0.2 122);
  --display: 'Archivo', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--display); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }

/* case index */
/* quiet, with context: a small heading, numbers at stat size in off-white, one line of context each; lime only on the case number */
.mk-index-nav { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.mk-index-wrap { max-width: 1216px; margin: 0 auto; padding: 22px 40px 0; }
.mk-index-head { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; font: 500 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); }
.mk-index { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
a.mk-idx { display: block; color: inherit; padding: 22px 28px 28px; border-left: 1px solid var(--rule); transition: background-color .25s ease; }
a.mk-idx:first-child { padding-left: 0; border-left: 0; }
a.mk-idx:last-child { padding-right: 0; }
a.mk-idx:hover { color: inherit; background: rgba(242, 239, 232, .03); }
.mk-dest { display: flex; align-items: center; gap: 10px; font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); }
.mk-dest-n { color: var(--lime); }
.mk-dest-co { color: rgba(242, 239, 232, .85); }
.mk-arrow { margin-left: auto; color: var(--fg-3); transition: transform .25s ease, color .25s ease; }
a.mk-idx:hover .mk-arrow { transform: translateY(3px); color: var(--lime); }
.mk-idx-n { margin-top: 18px; font: 800 clamp(30px, 3.2vw, 40px)/1 var(--display); font-stretch: 120%; letter-spacing: -.02em; color: var(--fg); white-space: nowrap; }
.mk-idx-l { margin-top: 10px; display: flex; align-items: center; gap: 8px; font: 600 11px/1 var(--mono); letter-spacing: .14em; color: rgba(242, 239, 232, .7); }
.mk-idx-l svg { width: 14px; height: 14px; color: var(--fg-3) !important; }
.mk-idx-c { margin: 12px 0 0; max-width: 32ch; font: 400 14px/1.5 var(--display); color: var(--fg-2); text-wrap: pretty; }
.mk-unit { font-size: .5em; letter-spacing: .02em; margin-left: .12em; }
@media (max-width: 1000px) {
  .mk-index { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  a.mk-idx { padding: 20px 20px 24px; }
  a.mk-idx:nth-child(odd) { padding-left: 0; border-left: 0; }
  a.mk-idx:nth-child(even) { padding-right: 0; }
  a.mk-idx:nth-child(n+3) { border-top: 1px solid var(--rule); }
}
@media (max-width: 600px) {
  .mk-index-wrap { padding: 18px 24px 0; }
  .mk-index-head > span:last-child { display: none; }
  a.mk-idx { padding: 16px 12px 20px; }
  .mk-idx-n { font-size: clamp(24px, 7.5vw, 30px); }
  .mk-idx-c { font-size: 13px; }
  .mk-index .mk-arrow { display: none; }
}
@media (max-width: 480px) { .mk-index-wrap { padding-inline: 16px; } }
@media (max-width: 600px) { .mk-chart > div:first-child > span:last-child { display: none; } }

/* chart callout, shown on phones where the in-chart callout is cropped away */
.mk-chart-callout { display: none; }
@media (max-width: 600px) {
  .mk-chart-callout { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 14px; }
  .mk-cc-n { font: 800 52px/1 var(--display); font-stretch: 118%; letter-spacing: -.03em; color: var(--lime); }
  .mk-cc-l { font: 500 10px/1.5 var(--mono); letter-spacing: .12em; color: var(--fg-3); }
}

/* case hero */
.mk-case { scroll-margin-top: 64px; }
.mk-case-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 32px 56px; align-items: end; margin-bottom: 36px; }
.mk-case-hero h2 { margin: 0 !important; }
.mk-sub { margin: 0; max-width: 54ch; font: 400 17px/1.6 var(--display); color: var(--fg-2); text-wrap: pretty; }
.mk-stats { max-width: 760px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.mk-stat { padding: 18px 16px 0 0; min-width: 0; }
.mk-stat + .mk-stat { padding-left: 18px; border-left: 1px solid var(--rule); }
.mk-stat-n { font: 800 34px/1 var(--display); font-stretch: 120%; letter-spacing: -.01em; white-space: nowrap; }
.mk-stat-l { margin-top: 9px; font: 500 10px/1.45 var(--mono); letter-spacing: .12em; color: var(--fg-3); }
@media (max-width: 480px) { .mk-stat-n { font-size: 26px; } .mk-stat + .mk-stat { padding-left: 12px; } .mk-stat { padding-right: 10px; } }

/* signature visual: exploded layers drawn live in code (stack.js), built once when in view */
.mk-sv { margin: 4px 0 0; }
.mk-sv-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; margin-top: 4px; }
.mk-sv-pair .mk-sv canvas { aspect-ratio: 21 / 18; }
.mk-sv-cap { margin-top: 4px; text-align: center; font: 500 11px/1.4 var(--mono); letter-spacing: .14em; color: var(--fg-3); }
@media (max-width: 600px) { .mk-sv-pair { grid-template-columns: 1fr; gap: 24px; } .mk-sv-pair .mk-sv canvas { aspect-ratio: 4 / 3; } }
.mk-list { margin: 0; padding-left: 20px; display: grid; gap: 10px; max-width: 78ch; color: var(--fg-2); font: 400 16px/1.6 var(--display); }
.mk-sv canvas { display: block; width: 100%; aspect-ratio: 21 / 9; }
@media (max-width: 600px) {
  /* phones: the whole drawing re-fits a 4:3 frame instead of being cropped */
  .mk-sv { margin-inline: -24px; }
  .mk-sv canvas { aspect-ratio: 4 / 3; }
}
@media (max-width: 480px) { .mk-sv { margin-inline: -16px; } }

/* toggle: no box, centred caps, chevron bobs; open = label crossfade synced to the chevron flip */
.mk-toggle { --flip: .5s; --half: .25s; margin-top: 24px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 14px 16px; background: none; border: 0; color: var(--fg); cursor: pointer; font: inherit; }
.mk-t-label { display: grid; font: 600 13px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--lime); transition: color .25s; }
.mk-t-label > span { grid-area: 1 / 1; }
.mk-t-closed { opacity: 1; transition: opacity var(--half) ease-out var(--half); }
.mk-t-open { opacity: 0; transition: opacity var(--half) ease-in 0s; }
.mk-toggle[aria-expanded="true"] .mk-t-closed { opacity: 0; transition: opacity var(--half) ease-in 0s; }
.mk-toggle[aria-expanded="true"] .mk-t-open { opacity: 1; transition: opacity var(--half) ease-out var(--half); }
.mk-t-meta { font: 500 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); transition: opacity var(--flip) cubic-bezier(.65, 0, .35, 1); }
.mk-toggle[aria-expanded="true"] .mk-t-meta { opacity: .45; }
.mk-t-icon { margin-top: 2px; display: grid; place-items: center; color: var(--lime); transition: transform var(--flip) cubic-bezier(.65, 0, .35, 1), color .25s; }
.mk-t-icon svg { animation: mk-bob 1.8s ease-in-out infinite; }
/* the whole control is lime; hover lifts it to off-white */
.mk-toggle:hover .mk-t-icon, .mk-toggle:hover .mk-t-label { color: var(--fg); }
.mk-toggle[aria-expanded="true"] .mk-t-icon { transform: scaleY(-1); }
@keyframes mk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* drawer */
.mk-drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s cubic-bezier(.3,.7,.2,1); }
.mk-drawer.open { grid-template-rows: 1fr; }
.mk-drawer-inner { overflow: hidden; min-height: 0; }
.mk-drawer.open .mk-drawer-inner.settled { overflow: visible; }
.mk-drawer-body { display: grid; gap: 24px; padding-top: 44px; }
.mk-block { min-width: 0; }
.mk-eyebrow { margin-bottom: 20px; font: 600 11px/1 var(--mono); letter-spacing: .16em; color: var(--lime); }
.mk-bullets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px 48px; margin-bottom: 20px; }
.mk-close { justify-self: center; margin-top: 12px; background: none; border: 0; border-radius: 100px; padding: 12px 18px; color: var(--fg-3); font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; transition: border-color .25s, color .25s; }
.mk-close:hover { color: var(--lime); }

/* next */
.mk-next { display: grid; border-top: 1px solid var(--rule); }
.mk-next-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--rule); font: 800 20px/1.2 var(--display); font-stretch: 112%; }
.mk-next-row .mk-dest-n { font: 500 11px/1 var(--mono); letter-spacing: .12em; }
.mk-next-s { font: 500 10.5px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); text-align: right; }
@media (max-width: 560px) { .mk-next-row { grid-template-columns: 32px minmax(0, 1fr); } .mk-next-s { grid-column: 2; text-align: left; } }

@media (prefers-reduced-motion: reduce) {
  .mk-drawer, .mk-toggle, .mk-t-icon, .mk-t-meta, .mk-arrow, a.mk-idx, .mk-t-label > span { transition: none !important; }
  .mk-t-icon svg { animation: none !important; }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

/*STACK*/
</script>
<script>
(function () {
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var G = !reduce && window.gsap && window.ScrollTrigger;
  if (G) gsap.registerPlugin(ScrollTrigger);
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  // ---- toggle + drawer, per case ----
  var opener = {};
  $$('.mk-case').forEach(function (cs) {
    var btn = $('.mk-toggle', cs), drawer = $('.mk-drawer', cs), inner = $('.mk-drawer-inner', cs), revealed = false;
    if (!btn || !drawer) return;
    var blocks = $$('.mk-block', cs);
    function setOpen(open) {
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      $('.mk-t-closed', btn).setAttribute('aria-hidden', open ? 'true' : 'false');
      $('.mk-t-open', btn).setAttribute('aria-hidden', open ? 'false' : 'true');
      inner.classList.remove('settled');
      if (open) inner.removeAttribute('inert'); else inner.setAttribute('inert', '');
      if (open && G && !revealed) gsap.set(blocks, { opacity: 0, y: 28 });
      drawer.classList.toggle('open', open);
      if (reduce || !G) settle();
    }
    function settle() {
      if (drawer.classList.contains('open')) inner.classList.add('settled');
      if (G) ScrollTrigger.refresh();
      if (drawer.classList.contains('open') && G && !revealed) { revealed = true; buildReveal(blocks); }
    }
    drawer.addEventListener('transitionend', function (e) { if (e.target === drawer) settle(); });
    btn.addEventListener('click', function () { setOpen(btn.getAttribute('aria-expanded') !== 'true'); });
    $('.mk-close', cs).addEventListener('click', function () {
      var y = btn.getBoundingClientRect().top + window.scrollY - 140;
      window.scrollTo({ top: y, behavior: 'instant' });
      setOpen(false);
      btn.focus({ preventScroll: true });
    });
    opener[cs.id] = setOpen;
  });
  $$('[data-open]').forEach(function (a) {
    a.addEventListener('click', function () { if (opener[a.dataset.open]) opener[a.dataset.open](true); });
  });
  if (opener[location.hash.slice(1)]) opener[location.hash.slice(1)](true);

  // ---- drawer reveal: blocks rise in as they enter the view ----
  function buildReveal(blocks) {
    // IntersectionObserver rather than ScrollTrigger: the drawer's height keeps
    // changing while it opens, so cached trigger positions go stale.
    var seen = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        seen.unobserve(e.target);
        gsap.to(e.target, { opacity: 1, y: 0, duration: .7, ease: 'power2.out', clearProps: 'transform,opacity' });
        inside(e.target);
      });
    }, { rootMargin: '0px 0px -10% 0px' });
    blocks.forEach(function (b) { seen.observe(b); });
  }
  function inside(b) {
    var svg = $('[data-m~="scrub"]', b) || $('svg [data-mp]', b) && $('svg [data-mp]', b).ownerSVGElement;
    if (svg) {
      gsap.timeline({ delay: .25 })
        .from($$('[data-mp~="ticket"]', svg), { y: -18, opacity: 0, stagger: .12, duration: .35 })
        .from($$('[data-mp~="divider"]', svg), { scaleX: 0, transformOrigin: '0% 50%', duration: .35 })
        .from($$('[data-mp~="check"]', svg), { scale: 0, transformOrigin: '50% 50%', opacity: 0, duration: .35 });
    }
    $$('[data-m~="ba"]', b).forEach(function (el) {
      gsap.from(el.children, { y: 20, opacity: 0, duration: .6, ease: 'power2.out', stagger: .25, delay: .2, clearProps: 'transform,opacity' });
    });
    $$('[data-m~="bar"]', b).forEach(function (el) {
      gsap.from(el.children, { scaleX: 0, transformOrigin: '0% 50%', duration: .8, ease: 'power2.out', stagger: .15, delay: .3, clearProps: 'transform' });
    });
    $$('[data-m~="stagger"]', b).forEach(function (el) {
      gsap.from(el.children, { y: 24, opacity: 0, duration: .6, ease: 'power2.out', stagger: .08, delay: .15, clearProps: 'transform,opacity' });
    });
  }

  // ---- signature visual: exploded layers drawn live; each builds once in view (finished with reduced motion) ----
  $$('canvas[data-stack]').forEach(function (c) {
    var phone = window.matchMedia('(max-width: 600px)').matches;
    window.STACK && STACK.mount(c, { pad: phone ? [0.05, 0.03] : [0.06, 0.12] });
  });

  // ---- chart: bars grow and the trend line draws once on screen ----
  var chart = $('.mk-chart');
  if (chart) {
    var svgEl = $('svg', chart), fullVB = svgEl.getAttribute('viewBox');
    var phone = matchMedia('(max-width: 600px)');
    var crop = function () { svgEl.setAttribute('viewBox', phone.matches ? '20 20 704 230' : fullVB); };
    crop(); phone.addEventListener('change', crop);
    var line = $('polyline', chart), dots = $$('svg g[fill] circle', chart);
    if (G && line) {
      var len = line.getTotalLength();
      gsap.set(line, { strokeDasharray: len, strokeDashoffset: len });
      gsap.set(dots, { opacity: 0 });
    }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        chart.classList.add('mk-inview');
        if (G && line) {
          gsap.to(line, { strokeDashoffset: 0, duration: 1.4, ease: 'power2.inOut', delay: .3 });
          gsap.to(dots, { opacity: 1, duration: .4, delay: 1.5, stagger: .2 });
        }
        io.disconnect();
      });
    }, { threshold: .35 });
    io.observe(chart);
  }

  // ---- numbers count up when they enter the view ----
  if (G) {
    $$('[data-m~="count"]').forEach(function (el) {
      var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), node;
      while ((node = w.nextNode()) && !/[0-9]/.test(node.nodeValue)) {}
      if (!node) return;
      var m = /^([^0-9]*)([0-9]+)(.*)$/.exec(node.nodeValue);
      if (!m || +m[2] === 0) return;
      var final = node.nodeValue, obj = { n: 0 };
      gsap.to(obj, { n: +m[2], duration: .9, ease: 'power1.out',
        scrollTrigger: { trigger: el, start: 'top bottom', once: true },
        onStart: function () { el.style.minWidth = el.getBoundingClientRect().width + 'px'; },
        onUpdate: function () { node.nodeValue = m[1] + Math.round(obj.n) + m[3]; },
        onComplete: function () { node.nodeValue = final; el.style.minWidth = ''; } });
    });
    // hero copy and case header rise in once
    gsap.from([$('[data-r="hero-h1"]'), $('[data-r="hero-h1"]').nextElementSibling, $('[data-r="profile-card"]')],
      { y: 24, opacity: 0, duration: .8, ease: 'power2.out', stagger: .12, clearProps: 'transform,opacity' });
    $$('.mk-case').forEach(function (cs) {
      gsap.from($$('.mk-case-hero > div', cs), { y: 24, opacity: 0, duration: .7, ease: 'power2.out', stagger: .12, clearProps: 'transform,opacity',
        scrollTrigger: { trigger: cs, start: 'top 75%', once: true } });
    });
  }
})();
</script>
