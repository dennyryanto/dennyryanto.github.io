<title>Portfolio Hi-Fi</title>
<style>
/* fonts: the live site's own files (build_hifi.py inlines them; build_site.py moves them to assets/fonts and preloads the latin ones) */
/*__FONTS__*/

/* Live site styles, reused as-is */
/*__SITE_CSS__*/
</style>
<style>
/* Layout: a twelve-column grid in the live site's 1216px column (design/AUDIT.md, "Type C, grid 1"). A label column, three
   columns wide, carries the numbers, names, dates, titles and remarks; everything else hangs from the fourth column.
   Switzer for text and Clash Grotesk (--head) for the headings, big numbers and wordmark, at two weights; labels in sentence case, untracked. The drawings keep their own lettering. */
:root {
  --bg: #161511;
  --card: rgb(16, 15, 9);
  --fg: #f2efe8;
  --fg-2: rgba(242, 239, 232, .78);
  --fg-3: rgba(242, 239, 232, .64);
  --rule: rgba(242, 239, 232, .14);
  --lime: oklch(0.9 0.2 122);
  --display: 'Switzer', 'Mk Arrows', system-ui, sans-serif;
  --head: 'Clash Grotesk', 'Mk Arrows', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;   /* only where mono is the material: code tokens, the terminal, product screens */
  --gut: 24px;
  --pad: 40px;   /* the page's side gutter; every wrap uses it, so the bands and the sections share one left edge */
  color-scheme: dark;
}
@media (max-width: 820px) { :root { --pad: 24px; } }
@media (max-width: 480px) { :root { --pad: 16px; } }
html, body { overflow-x: clip; }
/* the surfaces the browser draws: scrollbar, form accents, the tap flash */
html { scrollbar-color: rgba(242, 239, 232, .28) var(--bg); accent-color: var(--lime); }
a, button, canvas { -webkit-tap-highlight-color: oklch(0.9 0.2 122 / .16); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--display); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
/* skip link: off screen until it takes keyboard focus */
.mk-skip { position: absolute; left: 12px; top: -64px; z-index: 100; padding: 12px 16px; border-radius: 6px; background: var(--lime); color: #161511; font: 500 14px/1 var(--display); text-decoration: none; }
.mk-skip:focus { top: 12px; }
.mk-skip:hover { color: #161511; }   /* the captured stylesheet turns every hovered link lime, which is this link's ground */
#main:focus { outline: none; }
/* touch targets: the small links keep their look and get a 44px hit area (WCAG 2.5.8 asks 24, the platforms ask 44) */
[data-r="topbar"] a, .mk-contact a.scp0, a[data-r="avail"] { position: relative; }
[data-r="topbar"] a::after, .mk-contact a.scp0::after { content: ""; position: absolute; inset: -16px -10px; }
a[data-r="avail"]::after { content: ""; position: absolute; inset: -12px 0; }

/* ---- the grid: label column and hanging body ---- */
.mk-hang { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gut); row-gap: 20px; align-items: start; }
.mk-hang > .mk-hl { grid-column: 1 / 4; display: grid; gap: 4px; align-content: start; min-width: 0; }
.mk-hang > .mk-hb { grid-column: 4 / -1; min-width: 0; }
.mk-lb { font: 400 13px/1.4 var(--display); }
.mk-lt { margin: 0; font: 500 15px/1.35 var(--display); color: var(--fg); text-wrap: balance; }
.mk-ln { font: 400 13px/1.45 var(--display); color: var(--fg-3); }
.mk-lc { margin: 10px 0 0; max-width: 34ch; font: 400 14px/1.5 var(--display); color: var(--fg-2); text-wrap: pretty; }
.mk-lc + .mk-lc { margin-top: 8px; font-size: 13px; color: var(--fg-3); }
.mk-hb > [class$="-wrap"] { margin-top: 0 !important; }
.mk-after { margin-top: 24px; }
@media (max-width: 900px) {
  .mk-hang { grid-template-columns: minmax(0, 1fr); row-gap: 16px; }
  .mk-hang > * { grid-column: 1 / -1 !important; }
  .mk-lc { max-width: 60ch; }
}

/* ---- top bar ---- */
.mk-top { max-width: 1216px; margin: 0 auto; padding: 18px var(--pad); display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; }
.mk-top a { font: 400 13px/1 var(--display); letter-spacing: 0; color: var(--fg-2); text-decoration: none; transition: color .2s; }
.mk-top a:hover { color: var(--fg); }
.mk-top a:active { color: var(--lime); }
.mk-top .mk-brand { font: 500 15px/1 var(--head); letter-spacing: -.01em; color: var(--fg); }
.mk-top nav, .mk-top-r { display: flex; gap: 12px 24px; flex-wrap: wrap; }
.mk-top-r a:last-child { color: var(--lime); }
@media (max-width: 600px) { .mk-top { padding-block: 14px; } }

/* ---- the opening ---- */
.mk-open { max-width: 1216px; margin: 0 auto; padding: 56px var(--pad) 64px; row-gap: 36px; }
.mk-open > .mk-hl { padding-top: 12px; }
.mk-open-h { grid-column: 4 / -1; min-width: 0; }
.mk-h1 { margin: 0; font: 500 clamp(40px, 6.2vw, 84px)/.98 var(--head); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
.mk-open-text { grid-column: 4 / 9; display: grid; gap: 28px; justify-items: start; min-width: 0; }
.mk-lede { margin: 0; font: 400 18px/1.55 var(--display); color: var(--fg-2); text-wrap: pretty; }
.mk-avail { font: 400 15px/1.3 var(--display); letter-spacing: 0; color: var(--fg); text-decoration: underline; text-decoration-color: var(--lime); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.mk-avail:hover, .mk-avail:active { color: var(--lime); }
.mk-open > [data-r="profile-card"] { grid-column: 9 / -1; width: 100%; box-sizing: border-box; }
/* small laptops: four columns are too narrow for the card, so it sits under the text, both from the fourth column */
@media (max-width: 1180px) and (min-width: 901px) { .mk-open-text { grid-column: 4 / -1; max-width: 62ch; } .mk-open > [data-r="profile-card"] { grid-column: 4 / -1; } }
@media (max-width: 900px) { .mk-open { padding-block: 40px 56px; row-gap: 28px; } .mk-open > .mk-hl { padding-top: 0; } }

/* ---- case index: four outcomes on the grid, three columns each ---- */
.mk-index-nav { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.mk-index-wrap { max-width: 1216px; margin: 0 auto; padding: 0 var(--pad); }
.mk-index { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--gut); }
a.mk-idx { display: block; color: inherit; padding: 20px 0 28px; text-decoration: none; }
a.mk-idx:hover { color: inherit; }
.mk-dest { display: flex; gap: 8px; font: 400 13px/1.2 var(--display); }
.mk-dest-n { color: var(--lime); }
.mk-dest-co { color: var(--fg); text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 4px; transition: text-decoration-color .2s; }
a.mk-idx:hover .mk-dest-co, a.mk-idx:active .mk-dest-co { text-decoration-color: var(--lime); }
.mk-idx-n { margin-top: 18px; font: 500 clamp(30px, 3.2vw, 40px)/1 var(--head); letter-spacing: -.02em; color: var(--fg); white-space: nowrap; }
.mk-idx-l { margin-top: 10px; font: 400 13px/1.3 var(--display); color: var(--fg); }
.mk-idx-c { margin: 6px 0 0; max-width: 32ch; font: 400 14px/1.5 var(--display); color: var(--fg-3); text-wrap: pretty; }
.mk-unit { font-size: .45em; letter-spacing: 0; margin-left: .14em; }
@media (max-width: 1000px) {
  .mk-index { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  a.mk-idx:nth-child(n+3) { border-top: 1px solid var(--rule); }
}
@media (max-width: 600px) { .mk-idx-n { font-size: clamp(26px, 7.5vw, 30px); } .mk-idx-c { font-size: 13px; } }

/* ---- clients and brands: the label, then the logos from the fourth column ---- */
.mk-clients { border-bottom: 1px solid var(--rule); }
.mk-clients-wrap { max-width: 1216px; margin: 0 auto; padding: 36px var(--pad) 44px; }
.mk-clients-wrap > .mk-hl { padding-top: 38px; }
.mk-clients-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.mk-client { height: 96px; display: grid; place-items: center; padding: 10px 20px; }
/* every logo becomes one light mark, so dark and light originals read the same on the ink */
.mk-client img { max-width: 100%; max-height: min(calc(40px * var(--s, 1)), 68px); width: auto; height: auto; display: block; filter: brightness(0) invert(1); opacity: .8; transition: opacity .25s; }
.mk-client:hover img { opacity: .95; }
@media (max-width: 1000px) { .mk-clients-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 900px) { .mk-clients-wrap > .mk-hl { padding-top: 0; } }
@media (max-width: 600px) { .mk-clients-wrap { padding-block: 28px 36px; } .mk-clients-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } .mk-client { height: 72px; padding: 8px; } .mk-client img { max-height: min(calc(30px * var(--s, 1)), 52px); } }

/* ---- case hero: label column, title and description on columns 4 to 8, the drawing on 9 to 12 ---- */
.mk-case { scroll-margin-top: 64px; }
.mk-hero { row-gap: 28px; }
.mk-hero > .mk-split-text { grid-column: 4 / 9; display: grid; gap: 18px; min-width: 0; }
.mk-hero > .mk-sv { grid-column: 9 / -1; margin: 0; }
.mk-hero > .mk-sv-pair { grid-column: 4 / -1; }
.mk-meta-n { color: var(--lime); }
.mk-h2 { margin: 0; font: 500 clamp(30px, 3.4vw, 46px)/1.04 var(--head); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
.mk-sub { margin: 0; max-width: 54ch; font: 400 17px/1.6 var(--display); color: var(--fg-2); text-wrap: pretty; }
/* who the company is: a quieter line under the description, set off by a short rule */
.mk-abouts { display: grid; gap: 8px; max-width: 54ch; padding-top: 16px; border-top: 1px solid var(--rule); }
.mk-about { margin: 0; font: 400 14px/1.55 var(--display); color: var(--fg-3); text-wrap: pretty; }
.mk-about b { font-weight: 500; color: var(--fg-2); }
.mk-spec { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; padding: 0; list-style: none; font: 400 13px/1.3 var(--display); color: var(--fg-3); }

/* signature visual: exploded layers drawn live in code (stack.js), built once when in view */
.mk-sv canvas { display: block; width: 100%; aspect-ratio: 4 / 5; }
.mk-sv-wide canvas { aspect-ratio: 5 / 4; }
.mk-sv-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--gut); }
.mk-sv-pair .mk-sv { margin: 0; }
.mk-sv-pair .mk-sv canvas { aspect-ratio: 21 / 18; }
.mk-sv-cap { margin-top: 4px; font: 400 13px/1.4 var(--display); color: var(--fg-3); }
/* the stacks can be turned by dragging or with the arrow keys */
.mk-sv canvas:focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; border-radius: 6px; }
@media (max-width: 900px) { .mk-sv canvas { aspect-ratio: 4 / 3; } }
@media (max-width: 600px) {
  /* phones: the whole drawing re-fits a 4:3 frame instead of being cropped */
  .mk-hero > .mk-sv { margin-inline: calc(-1 * var(--pad)); }
  .mk-sv-pair { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .mk-sv-pair .mk-sv canvas { aspect-ratio: 4 / 3; }
}

/* ---- toggle: a text control hanging from the fourth column; the chevron bobs, and flips when the case study is open ---- */
.mk-tog { margin-top: 24px; }
.mk-toggle { --flip: .5s; --half: .25s; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 6px 10px; width: 100%; max-width: 62ch; min-height: 44px; padding: 10px 0; background: none; border: 0; color: var(--fg); cursor: pointer; font: inherit; text-align: left; }
.mk-t-label { display: grid; justify-content: start; font: 500 16px/1.2 var(--display); color: var(--lime); transition: color .25s; }
.mk-t-label > span { grid-area: 1 / 1; }
.mk-t-closed { opacity: 1; transition: opacity var(--half) ease-out var(--half); }
.mk-t-open { opacity: 0; transition: opacity var(--half) ease-in 0s; }
.mk-toggle[aria-expanded="true"] .mk-t-closed { opacity: 0; transition: opacity var(--half) ease-in 0s; }
.mk-toggle[aria-expanded="true"] .mk-t-open { opacity: 1; transition: opacity var(--half) ease-out var(--half); }
.mk-t-meta { grid-column: 1 / -1; font: 400 13px/1.45 var(--display); color: var(--fg-3); }
.mk-t-icon { order: -1; display: grid; place-items: center; color: var(--lime); transition: transform var(--flip) cubic-bezier(.65, 0, .35, 1), color .25s; }
.mk-t-icon svg { animation: mk-bob 1.8s ease-in-out infinite; }
/* the whole control is lime; hover lifts it to off-white */
.mk-toggle:hover .mk-t-icon, .mk-toggle:hover .mk-t-label, .mk-toggle:active .mk-t-icon, .mk-toggle:active .mk-t-label { color: var(--fg); }
.mk-toggle[aria-expanded="true"] .mk-t-icon { transform: scaleY(-1); }
@keyframes mk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

/* ---- drawer: units, each with a rule above, its label column and its hanging body ---- */
.mk-drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s cubic-bezier(.3,.7,.2,1); }
.mk-drawer.open { grid-template-rows: 1fr; }
.mk-drawer-inner { overflow: hidden; min-height: 0; }
.mk-drawer.open .mk-drawer-inner.settled { overflow: visible; }
/* a shut drawer (closed and finished collapsing) is skipped by style, layout and paint: most of the page lives in them */
.mk-drawer-inner.mk-shut { content-visibility: hidden; }
.mk-drawer-body { display: grid; gap: 56px; padding-top: 40px; }
.mk-block { min-width: 0; border-top: 1px solid var(--rule); padding-top: 20px; }
.mk-end { margin-top: -24px; }
.mk-close { min-height: 44px; padding: 10px 0; background: none; border: 0; color: var(--fg-2); font: 400 14px/1 var(--display); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 5px; cursor: pointer; transition: color .25s; }
.mk-close:hover, .mk-close:active { color: var(--lime); }

/* key numbers: left-aligned on the grid, three columns each (four share the nine columns for Komunal's four shifts) */
.mk-keys { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 28px var(--gut); }
.mk-key { min-width: 0; }
.mk-key-n { font: 500 clamp(40px, 5vw, 64px)/1 var(--head); letter-spacing: -.02em; white-space: nowrap; }
.mk-key-l { margin-top: 12px; font: 400 13px/1.4 var(--display); color: var(--fg); }
.mk-key-c { margin: 6px 0 0; max-width: 30ch; font: 400 14px/1.5 var(--display); color: var(--fg-3); text-wrap: pretty; }
@media (max-width: 700px) { .mk-keys { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* what I did: one column at a reading measure */
.mk-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; max-width: 70ch; color: var(--fg-2); font: 400 16px/1.6 var(--display); }

/* the board every diagram and mock-up sits on (the same panel as the diagrams in design/sections) */
.mk-board { min-width: 0; padding: 28px; border-radius: 14px; background: #1a1b1f; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 30px 60px -30px rgba(0, 0, 0, .9); }
.mk-board.flush { padding: 0; overflow: hidden; }
.mk-board.flush .mk-fan-foot { padding: 0 28px 22px; }
@media (max-width: 600px) { .mk-board { padding: 14px; } .mk-board.flush .mk-fan-foot { padding: 0 14px 16px; } }

/* shipped screens (LinkAja): one dark panel, phones in a centred row with numbered captions */
.ksf-panel { min-height: 340px; background: #1a1b1f; border-radius: 14px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 30px 60px -30px rgba(0, 0, 0, .9); padding: 26px; display: flex; flex-direction: column; color: var(--fg); }
.ksf-row { flex: 1 1 0%; display: flex; gap: 16px; align-items: flex-start; justify-content: center; }
.ksf-step { flex: 1 1 0; min-width: 0; max-width: 236px; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.ksf-step > div { max-width: none !important; }
.ksf-step figcaption { font: 400 13px/1.4 var(--display); color: var(--fg-2); text-align: center; }
.ksf-step figcaption b { color: var(--fg); font-weight: 500; }
@media (max-width: 760px) {
  .ksf-panel { padding: 16px; }
  .ksf-row { flex-wrap: wrap; gap: 20px 12px; }
  .ksf-step { flex: 0 0 calc(50% - 6px); }
}
/* the Garmin glass cockpit fan: real screens stacked in depth; the front one swipes away every 4.5s while on screen */
.mk-fan { position: relative; outline: none; }
.mk-fan:focus-visible .mk-fan-stage { outline: 2px solid var(--lime); outline-offset: 4px; }
.mk-fan-stage { position: relative; height: clamp(440px, 46vw, 620px); perspective: 1800px; perspective-origin: 25% 40%; overflow: hidden; touch-action: pan-y; }
.mk-fan-card { position: absolute; margin: 0; left: 14%; top: 4%; width: clamp(220px, 23vw, 330px); aspect-ratio: 780 / 1688; transition: transform .9s cubic-bezier(.6, 0, .2, 1), opacity .9s ease; cursor: pointer; will-change: transform; }
.mk-fan-card img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 22px; border: 1px solid rgba(242, 239, 232, .14); box-shadow: 0 30px 60px -24px rgba(0, 0, 0, .7), -18px 0 40px -12px rgba(0, 0, 0, .55); }
/* screens further back are darkened, never see-through: an opaque screen under a black shade, so layers don't show through each other */
.mk-fan-shade { position: absolute; inset: 0; border-radius: 22px; background: #000; opacity: 0; pointer-events: none; transition: opacity .9s ease; }
.mk-fan-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: 18px; }
.mk-fan-cap { min-width: 0; display: grid; gap: 6px; }
.mk-fan-cap .n { font: 400 13px/1 var(--display); color: var(--lime); }
.mk-fan-cap strong { font: 500 22px/1.15 var(--head); letter-spacing: -.02em; color: var(--fg); }
.mk-fan-cap .d { font: 400 15px/1.5 var(--display); color: var(--fg-2); }
.mk-fan-ticks { display: flex; gap: 4px; flex: none; }
.mk-fan-ticks button { background: none; border: 0; padding: 12px 2px; cursor: pointer; }
.mk-fan-ticks i { display: block; width: 24px; height: 2px; background: var(--rule); transition: background .3s; }
.mk-fan-ticks button.on i { background: var(--lime); }
@media (max-width: 600px) { .mk-fan-stage { height: clamp(380px, 112vw, 480px); } .mk-fan-card { left: 4%; width: 56vw; } .mk-fan-cap strong { font-size: 19px; } }

/* Stageshow demos (design/stageshow): a placeholder holds the space and shows the finished frame until the demo code loads,
   the first time a case study that has one opens (and for good without JavaScript). build_hifi.py adds one rule set per demo
   for its two designs; the wide one shows from the demo's own width threshold up. The demo's remark sits in the label column. */
.ss-mount { container-type: inline-size; min-width: 0; }
.ss-frame { position: relative; width: 100%; margin-inline: auto; }
.ss-poster { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ss-poster-compact { display: none; }
.ss-box { container-type: inline-size; }
.ss-chrona { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 32px 40px; align-items: center; }
@container (max-width: 860px) { .ss-chrona { grid-template-columns: minmax(0, 1fr); } }
/* the laptop's hinge lip is 104% wide and overhung its column by 2% each side (11px past the board's padding, the tablet beside it sat flush): the padding takes the overhang */
div:has(> [style*="width: 104%"]) { padding-inline: 2%; }
/* on a phone the demo gets the full 358px column it was designed for: the board's side padding moves onto the text */
@media (max-width: 600px) {
  .mk-board:has(> .ss-box) { padding-inline: 0; }
  .ss-chrona > div:last-child { padding-inline: 16px; }
}

/* ---- the lab: a band that introduces the two personal builds, a spec line in each hero, a faint workbench grid behind them ---- */
.mk-lab-band { border-top: 1px solid var(--rule); }
.mk-lab-wrap { max-width: 1216px; margin: 0 auto; padding: 80px var(--pad) 0; }
.mk-lab-t { font: 500 clamp(40px, 5vw, 64px)/1 var(--head); letter-spacing: -.02em; color: var(--fg); }
.mk-lab-wrap p { margin: 16px 0 0; max-width: 54ch; font: 400 17px/1.6 var(--display); color: var(--fg-2); text-wrap: pretty; }
.mk-lab { position: relative; --lime: oklch(0.84 0.12 215); }   /* the lab's own accent: instrument cyan, in step with LAB_OKLCH in build_hifi.py */
.mk-lab::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(242, 239, 232, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(242, 239, 232, .04) 1px, transparent 1px); background-size: 48px 48px; -webkit-mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent); }
.mk-lab > * { position: relative; z-index: 1; }
@media (max-width: 900px) { .mk-lab-wrap { padding-top: 56px; } }

/* the Dash table app bleeds past the page edge on the live site; inside a drawer it sits in the column */
.mk-drawer [data-r="bleed-col"] { width: 100%; max-width: 1040px; margin-inline: auto; }
.mk-drawer [data-r="bleed-stage"] { width: 100% !important; }
/* the cockpit close-ups keep the live isometric tiles, with more room between them */
.mk-drawer .gx-grid { gap: 40px; }

/* ---- background: the timeline on the grid (three columns each), then earlier work, capabilities and the degree ---- */
.mk-bg .mk-h2 { margin-bottom: 36px; }
.mk-career { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px var(--gut); }
.mk-co-about { margin-top: 4px; font: 400 13px/1.45 var(--display); color: var(--fg-3); }
.mk-caps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px var(--gut); }
.mk-cap-h { margin-bottom: 10px; font: 500 15px/1.3 var(--display); color: var(--fg); }
.mk-cap-l { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font: 400 14px/1.45 var(--display); color: var(--fg-2); }
.mk-edu { font: 400 16px/1.5 var(--display); color: var(--fg-2); }

  (function () {

    });
    pick('[data-m~="scrub"]').forEach(function (svg) { gsap.timeline(when(svg))
      .from($$('[data-mp~="ticket"]', svg), { y: -18, opacity: 0, stagger: .12, duration: .35 })
      .from($$('[data-mp~="divider"]', svg), { scaleX: 0, transformOrigin: '0% 50%', duration: .35 })
      .from($$('[data-mp~="check"]', svg), { scale: 0, transformOrigin: '50% 50%', opacity: 0, duration: .35 }); });

    var cards = $$('.mk-fan-card', fan), ticks = $$('.mk-fan-ticks button', fan), cap = $('.mk-fan-cap', fan);

  // ---- product screens: drawn at full size (data-fit = that width) and scaled to their frame's measured width. The CSS
