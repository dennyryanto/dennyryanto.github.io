<!-- Easter egg: a terminal that knows one question. Three ways in: the blinking cursor after "PORTFOLIO 2026" in the
     footer, the ~ key on desktop, and a white rabbit that roams the page: it pops up at a random spot for a few seconds,
     hops and vanishes, then turns up somewhere else, so it's easy to miss. Typing anything with "matrix" in it
     ("what is the matrix?") plays the journey: "Knock, knock.", green code rain over the whole page, the rain settling
     into the headline in ASCII, Denny's note on what the film did for him, then a choice of pills. Blue goes back; red
     keeps the site in Matrix mode (green monospace on black, photos rendered as ASCII, a faint rain behind) until the
     visitor types exit, presses Esc or reloads. Matrix mode deliberately ignores reduced motion. Needs JS; without it,
     the cursor and rabbit stay hidden. -->

  <div class="mxt-bar"><span>denny@portfolio: ~</span><button type="button" class="mxt-x" aria-label="Close the terminal">esc ✕</button></div>
  <div class="mxt-log" id="mxt-log" aria-live="polite"></div>
  <form class="mxt-row" id="mxt-form" autocomplete="off"><label for="mxt-in" class="mxt-ps">denny@portfolio:~$</label><input id="mxt-in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></form>
</div>
<div class="mx" id="mx" hidden>
  <canvas class="mx-rain" aria-hidden="true"></canvas>
  <div class="mx-say">
    <p class="mx-msg" aria-live="polite"></p>
    <div class="mx-pills">
      <button type="button" class="mx-pill mx-blue"><i aria-hidden="true"></i>Blue pill<small>back to the site as it was</small></button>
      <button type="button" class="mx-pill mx-red"><i aria-hidden="true"></i>Red pill<small>stay in the Matrix</small></button>
    </div>
  </div>
</div>
<canvas class="mx-bg" aria-hidden="true"></canvas>
<button type="button" class="mx-chip" hidden>MATRIX MODE · EXIT <span aria-hidden="true">[esc]</span></button>

      ox.fillStyle = 'rgba(0,255,65,' + (.25 + .75 * l).toFixed(2) + ')'; ox.fillText(RAMP.charAt(Math.min(RAMP.length - 1, Math.floor(l * RAMP.length))), x * cw, y * ch);
    }
    img.dataset.mx = img.getAttribute('src') || ''; if (img.hasAttribute('srcset')) { img.dataset.mxSet = img.getAttribute('srcset'); img.removeAttribute('srcset'); }
    var pic = img.parentNode && img.parentNode.tagName === 'PICTURE' ? img.parentNode : null;
    if (pic) [].forEach.call(pic.querySelectorAll('source'), function (so) { so.dataset.mxSet = so.getAttribute('srcset'); so.removeAttribute('srcset'); });
    img.src = out.toDataURL();
  }
  function enter() {
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    root.classList.add('mx-on'); chip.hidden = false;
    var bg = new Rain(bgC, 18, .08); bg.size(); bgStop = loop(bg, 20);
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return; var img = e.target; io.unobserve(img);
        if (img.complete) asciify(img); else img.addEventListener('load', function () { if (root.classList.contains('mx-on')) asciify(img); }, { once: true });
      });
    }, { rootMargin: '200px' });
    [].forEach.call(document.querySelectorAll('img'), function (img) { if (!img.closest('.mx, .mxt')) io.observe(img); });
  }
  function leave() {
    root.classList.remove('mx-on'); chip.hidden = true;
    if (bgStop) bgStop(); bgStop = null; if (io) io.disconnect(); io = null;
    [].forEach.call(document.querySelectorAll('img[data-mx]'), function (img) {
      if (img.dataset.mxSet) { img.setAttribute('srcset', img.dataset.mxSet); delete img.dataset.mxSet; }
      img.src = img.dataset.mx; delete img.dataset.mx;
      var pic = img.parentNode && img.parentNode.tagName === 'PICTURE' ? img.parentNode : null;
      if (pic) [].forEach.call(pic.querySelectorAll('source'), function (so) { if (so.dataset.mxSet) { so.setAttribute('srcset', so.dataset.mxSet); delete so.dataset.mxSet; } });
    });
  }
  chip.addEventListener('click', leave);
  addEventListener('resize', function () { if (bgStop) { bgStop(); var bg = new Rain(bgC, 18, .08); bg.size(); bgStop = loop(bg, 20); } });

  // the crab's last hint points here
  window.addEventListener('mx-hint', function () { [].forEach.call(document.querySelectorAll('.mx-cursor'), function (b) { b.classList.add('hint'); }); });
})();
</script>
