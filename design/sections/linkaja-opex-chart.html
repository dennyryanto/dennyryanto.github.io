<!-- LinkAja: CS OPEX after the self-service CTP revamp, in the shared diagram language (design/sections/VIZ-STYLE.md).
     A one-line strip: the -80% and one lime line from month 1 (the 100 mark) to month 12 (about a fifth of it), two end dots,
     both ends labelled. Only those facts are on the page; the months between carry no values. Earlier this was eight bars and a
     72px callout at 286px tall; the strip says the same in about a third of the height (owner: "this section looks rather large
     for the information it holds"). Lime marks the outcome only.
     Markup is the finished state, so the page is complete without JavaScript; the script starts from empty, draws the line,
     then holds; it replays only after the board has left the screen and come back. Reduced motion keeps the finished state.
     Nothing is measured, so it is safe inside a drawer that is still shut. -->
<div class="kop-wrap">
<style>
.kop-wrap {
  container-type: inline-size;
  --kop-panel: #1a1b1f; --kop-node: #232429; --kop-tile: #2b2c32; --kop-line: rgba(255, 255, 255, .08);
  --kop-ink: #f2f2f4; --kop-ink-2: #c2c3cb; --kop-ink-3: #8b8d98; --kop-edge: #4a4d57; --kop-grey: #6b6e78;
  --kop-lime: oklch(0.9 0.2 122); --kop-amber: #fdb022;
  margin-top: 24px;
}
.kop-head { display: flex; align-items: center; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; margin-bottom: 18px; }
.kop-head span { font: 600 11px/1.3 'IBM Plex Mono', monospace; letter-spacing: .14em; color: rgba(242, 239, 232, .6); }
.kop-head span:first-child { color: var(--kop-lime); }

.kop-board { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; border-radius: 14px; background: var(--kop-panel); box-shadow: 0 0 0 1px var(--kop-line), 0 30px 60px -30px rgba(0, 0, 0, .9); padding: 18px 28px; gap: 0 40px; font-family: Archivo, system-ui, sans-serif; color: var(--kop-ink); }
.kop-call { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.kop-call > * { transition: opacity .6s ease, transform .6s ease; }
.kop-call > :nth-child(1) { transition-delay: .2s; }
.kop-call > :nth-child(2) { transition-delay: .35s; }
.kop-val { font: 800 48px/1 Archivo, sans-serif; font-stretch: 112%; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--kop-lime); }
.kop-l1 { font: 600 12px/1.4 'IBM Plex Mono', monospace; letter-spacing: .08em; color: var(--kop-ink-2); }

.kop-chart { min-width: 0; }
/* the line sits in a fixed-height box, so nothing moves while it plays */
.kop-sk { position: relative; height: 48px; }
.kop-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; clip-path: inset(-12px -12px -12px -12px); transition: clip-path 1s cubic-bezier(.4, 0, .2, 1) .2s; }
.kop-line polyline { fill: none; stroke: var(--kop-lime); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.kop-glow { stroke-width: 7 !important; opacity: .13; }
.kop-pt { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--kop-lime); box-shadow: 0 0 0 2px var(--kop-panel); transition: opacity .3s, transform .3s; }
.kop-pt.start { transition-delay: .2s; }
.kop-pt.end { transition-delay: 1.1s; }
.kop-ticks { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .06em; color: var(--kop-ink-3); }

/* start state, applied by the script only; the markup above is the finished state */
.kop-pre .kop-line { clip-path: inset(-12px 100% -12px -12px); transition: none; }
.kop-pre .kop-pt { opacity: 0; transform: scale(.4); transition: none; }
.kop-pre .kop-call > * { opacity: 0; transform: translateY(6px); transition: none; }

/* narrow: the number sits over the line */
@container (max-width: 700px) {
  .kop-board { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 14px 0; }
  .kop-val { font-size: 44px; }
}
@media (prefers-reduced-motion: reduce) { .kop-wrap *, .kop-wrap *::before { transition: none !important; animation: none !important; } }
</style>

<div class="kop-head"><span>CS OPEX AFTER SELF-SERVICE CTP REVAMP · INDEXED</span><span>TICKET-DRIVEN → SELF-SERVICE</span></div>

<div class="kop-board">
  <div class="kop-call">
    <div class="kop-val">−80%</div>
    <div class="kop-l1">CUSTOMER-SERVICE OPEX</div>
  </div>
  <div class="kop-chart" role="img" aria-label="Customer-service operating cost falling roughly 80 percent as support shifts to self-service, from an index of 100 in month 1 to about 20 in month 12">
    <div class="kop-sk" aria-hidden="true">
      <svg class="kop-line" viewBox="0 0 560 46" preserveAspectRatio="none">
        <polyline class="kop-glow" points="6.0,6.0 84.3,9.2 162.6,13.6 240.9,19.2 319.1,25.6 397.4,30.4 475.7,33.6 554.0,34.8"/>
        <polyline points="6.0,6.0 84.3,9.2 162.6,13.6 240.9,19.2 319.1,25.6 397.4,30.4 475.7,33.6 554.0,34.8"/>
      </svg>
      <i class="kop-pt start" style="left:1.07%;top:13.04%"></i>
      <i class="kop-pt end" style="left:98.93%;top:75.64%"></i>
    </div>
    <div class="kop-ticks" aria-hidden="true"><span>MONTH 1 · INDEX 100</span><span>MONTH 12 · ~20</span></div>
  </div>
</div>

<script>
(function () {
  var wrap = document.currentScript.parentNode, board = wrap.querySelector('.kop-board');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) return;
  var done = false, visible = false, ran = false, pending = false;
  function reset() { wrap.classList.add('kop-pre'); void board.offsetWidth; }
  function play() {
    ran = true; pending = false;
    reset(); wrap.classList.remove('kop-pre');
    done = true;
  }
  function replay() {
    if (!visible || document.hidden) { pending = true; return; }
    play();
  }
  reset();
  new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (!visible && done) { done = false; pending = true; } if (visible && pending) play(); }, { threshold: 0 }).observe(board);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && pending && visible) play(); });
  var seen = new IntersectionObserver(function (es) {
    if (es[0].isIntersecting && es[0].intersectionRatio >= .4 && !ran) { seen.disconnect(); play(); }
  }, { threshold: [0, .4, .7] });
  seen.observe(board);
})();
</script>
</div>
