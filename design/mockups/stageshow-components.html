ur week and your circle’s availability, then drafts the plan in one tap.",layout:"split",stageWidth:640,notes:[["One phone, one story.","The Today screen opens on its AI card: Aulia turns 30 on Saturday and the crew looks free. One tap on the card's own button drafts the plan inside the card (the time from the circle's free window, the message written out word by word), and a second tap sends it. This replaces the still screenshot with its static overlay."],["The outcome sits outside the phone.","Coral stays inside the app's screens. The lime is the card beside the phone: Invite sent, in under 120 seconds, plan on the calendar, joined to the Send button by a leader. It is the engine diagram's outcome, shown where it happens."],["The bold top line is gone.","The 3px coral line along the top of the AI card (from the old screenshot) was removed at the owner's request. The card keeps only the aura ring, and after the invite is sent the ring stays dim so the card still reads as the AI's."],["The aura glow.","The old live card wore an animated overlay, a coral light travelling round its edge. It is rebuilt in CSS on the AI card only: a crisp 1.5px coral ring over a soft blurred halo, both driven by a conic gradient whose angle is a registered property turning once every 7s. It is on from the first frame, runs while the card waits on the person, and settles once the invite is sent (dimmer ring, no halo, held at its angle). Reduced motion shows it held at one angle. The lime outcome card is unchanged."],["Phone column.","The compact design keeps the same phone, a little larger in points, and moves the outcome card onto the phone's lower margin (over the calendar filler) with a short leader from the button."],["Not from the live mock.","The live screen has no place for the brunch and no draft message. The message is written from the card's own words (Aulia turns 30, Saturday, 11:00 to 13:00); there is no place row. The four faces are cropped from the live screenshot."]]},nc=
