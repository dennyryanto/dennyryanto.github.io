  <header class="rv-top">
    <p class="rv-eyebrow">Stageshow rebuild</p>
    <h1>Portfolio UI components</h1>
    <p class="rv-lead">Every product mockup on the site, redrawn with the Stageshow kit and looping. This page collects them as they pass review. Approved ones get ported into the build later.</p>

  <div class="rv-bar" role="toolbar" aria-label="Preview controls">

    </div>
    <button type="button" id="replay" class="rv-btn">Replay</button>
    <p class="rv-count" id="count" aria-live="polite"></p>
  </div>

  <div id="cases" class="rv-cases"></div>
  <section class="rv-queue" id="queue" aria-labelledby="q-title"></section>
</main>
